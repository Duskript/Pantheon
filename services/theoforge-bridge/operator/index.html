<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheoForge Approval Queue</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171e2e;
    --panel-2: #1d2638;
    --border: #2a3550;
    --text: #e8edf7;
    --muted: #93a0bd;
    --accent: #4f8cff;
    --accent-hover: #6ba0ff;
    --ok: #34d399;
    --warn: #fbbf24;
    --bad: #f87171;
    --chip-draft: #4f8cff;
    --chip-approved: #34d399;
    --chip-send_failed: #f87171;
    --chip-sent: #93a0bd;
    --chip-rejected: #a78bfa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
  }
  h1 { font-size: 20px; margin: 0; }
  .notice {
    border: 1px solid var(--warn);
    color: var(--warn);
    background: rgba(251, 191, 36, 0.08);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    flex-basis: 100%;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: end;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .field input {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 10px;
    min-width: 240px;
    font: inherit;
  }
  .field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit;
    font-weight: 600;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-approve { background: rgba(52, 211, 153, 0.14); border-color: rgba(52, 211, 153, 0.5); color: var(--ok); }
  .btn-reject { background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.5); color: var(--bad); }
  .btn-send { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #status[aria-live] {
    margin: 12px 20px 0;
    min-height: 22px;
    font-size: 14px;
    color: var(--muted);
  }
  #status.error { color: var(--bad); }
  #status.success { color: var(--ok); }
  main { padding: 16px 20px 48px; }
  .queue-state { color: var(--muted); padding: 28px 0; text-align: center; font-size: 15px; }
  .item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
    padding: 16px;
  }
  .item.rejected { opacity: 0.72; border-color: var(--chip-rejected); }
  .item-head {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
    margin-bottom: 10px;
  }
  .lead-name { font-size: 16px; font-weight: 700; }
  .lead-email { color: var(--muted); font-size: 13px; }
  .chip {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid var(--border);
  }
  .chip.draft { background: rgba(79, 140, 255, 0.14); color: var(--chip-draft); border-color: rgba(79, 140, 255, 0.5); }
  .chip.approved { background: rgba(52, 211, 153, 0.14); color: var(--chip-approved); border-color: rgba(52, 211, 153, 0.5); }
  .chip.send_failed { background: rgba(248, 113, 113, 0.14); color: var(--chip-send_failed); border-color: rgba(248, 113, 113, 0.5); }
  .chip.sent { background: rgba(147, 160, 189, 0.14); color: var(--chip-sent); border-color: rgba(147, 160, 189, 0.5); }
  .chip.rejected { background: rgba(167, 139, 250, 0.14); color: var(--chip-rejected); border-color: rgba(167, 139, 250, 0.5); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 12px;
    margin-bottom: 12px;
  }
  .section { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .section h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .section p { margin: 4px 0; font-size: 13px; overflow-wrap: anywhere; }
  .section .label { color: var(--muted); font-size: 12px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .actions .field input { min-width: 200px; }
  .item-msg { font-size: 13px; margin: 8px 0 0; }
  .item-msg.error { color: var(--bad); }
  .item-msg.success { color: var(--ok); }
  .send-info { font-size: 13px; color: var(--ok); margin: 6px 0 0; }
  .error-text { color: var(--bad); }
  a { color: var(--accent); }
  @media (max-width: 640px) {
    .toolbar, header { flex-direction: column; align-items: stretch; }
    .field input { min-width: 0; width: 100%; }
    .actions { flex-direction: column; align-items: stretch; }
    .actions button { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>TheoForge Approval Queue</h1>
  <button id="refresh-btn" class="btn-primary" type="button">Refresh queue</button>
  <div class="notice" role="note">Tailnet-only operator surface — no public campaign sending.</div>
</header>

<div class="toolbar">
  <div class="field">
    <label for="operator-identity">Operator identity</label>
    <input id="operator-identity" name="operator_identity" type="text" autocomplete="name"
           placeholder="e.g. konan" aria-describedby="identity-hint">
    <span id="identity-hint" class="label">Required before approving, rejecting, or sending.</span>
  </div>
  <div class="field">
    <label for="approval-version">Approval version</label>
    <input id="approval-version" name="approval_version" type="text" value="outreach-v1"
           aria-describedby="version-hint">
    <span id="version-hint" class="label">Deterministic default; edit for a new review round.</span>
  </div>
</div>

<p id="status" aria-live="polite"></p>

<main id="queue"></main>

<script>
"use strict";
(function () {
  var QUEUE_URL = "/outreach/queue?status=draft,send_failed";
  var DEFAULT_APPROVAL_VERSION = "outreach-v1";

  var queueEl = document.getElementById("queue");
  var statusEl = document.getElementById("status");
  var refreshBtn = document.getElementById("refresh-btn");
  var identityEl = document.getElementById("operator-identity");
  var versionEl = document.getElementById("approval-version");

  var items = [];
  var pending = false;

  function setStatus(text, kind) {
    statusEl.textContent = text || "";
    statusEl.className = kind || "";
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (key) {
        if (key === "class") node.className = attrs[key];
        else if (key === "text") node.textContent = attrs[key];
        else if (key.startsWith("on")) node.addEventListener(key.slice(2), attrs[key]);
        else node.setAttribute(key, attrs[key]);
      });
    }
    (children || []).forEach(function (child) {
      if (typeof child === "string") node.appendChild(document.createTextNode(child));
      else if (child) node.appendChild(child);
    });
    return node;
  }

  function labelValue(label, value) {
    var p = el("p", null, [
      el("span", { class: "label", text: label + ": " }),
      String(value == null || value === "" ? "—" : value),
    ]);
    return p;
  }

  function fmtTs(ts) {
    if (!ts) return "—";
    var d = new Date(ts);
    if (isNaN(d.getTime())) return String(ts);
    return d.toISOString().replace("T", " ").replace(/\.\d+Z$/, " UTC");
  }

  function statusChip(status) {
    return el("span", { class: "chip " + (status || "draft"), text: status || "unknown" });
  }

  // Build one queue item card. User-controlled fields are inserted with
  // textContent (never innerHTML) so lead/draft content cannot inject markup.
  function renderItem(item) {
    var draft = item.draft || {};
    var inbound = item.latest_inbound || {};

    var head = el("div", { class: "item-head" }, [
      el("span", { class: "lead-name", text: item.lead_name || "(no name)" }),
      el("span", { class: "lead-email", text: item.lead_email || "—" }),
      el("span", { class: "chip", text: "stage: " + (item.pipeline_stage || "—") }),
      statusChip(draft.status),
    ]);

    var meta = el("div", { class: "meta" }, [
      labelValue("created", fmtTs(draft.created_at)),
      labelValue("approved", fmtTs(draft.approved_at)),
      labelValue("sent", fmtTs(draft.sent_at)),
      labelValue("rejected", fmtTs(draft.rejected_at)),
      labelValue("provider id", draft.resend_id || null),
    ]);

    var inboundSection = el("div", { class: "section" }, [
      el("h3", { text: "Latest inbound" }),
      labelValue("subject", inbound.subject),
      labelValue("from", inbound.sender),
      labelValue("received", fmtTs(inbound.ts)),
      el("p", null, [el("span", { class: "label", text: "body: " }), inbound.text || "—"]),
    ]);

    var draftSection = el("div", { class: "section" }, [
      el("h3", { text: "Draft" }),
      labelValue("to", draft.to),
      labelValue("from", draft.from),
      labelValue("subject", draft.subject),
      el("p", null, [el("span", { class: "label", text: "body: " }), draft.text || draft.html || "—"]),
      labelValue("created by", draft.created_by),
      labelValue("approval version", draft.approval_version),
      labelValue("rejected by", draft.rejected_by),
      labelValue("rejection reason", draft.rejection_reason),
      labelValue("last error", draft.last_error),
    ]);

    var grid = el("div", { class: "grid" }, [inboundSection, draftSection]);

    var msg = el("p", { class: "item-msg" });
    var card = el("article", { class: "item" + (draft.status === "rejected" ? " rejected" : "") }, [
      head,
      meta,
      grid,
      msg,
    ]);

    // Mutating controls, gated by status.
    var actions = el("div", { class: "actions" });
    var sendInfo = el("p", { class: "send-info" });

    function identity() { return identityEl.value.trim(); }
    function requireIdentity() {
      if (identity()) return true;
      setStatus("Enter your operator identity before approving, rejecting, or sending.", "error");
      identityEl.focus();
      return false;
    }
    function run(urlPath, payload, onOk) {
      if (pending) return;
      pending = true;
      setActionsDisabled(true);
      setStatus("Working…");
      fetch(urlPath, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      }).then(function (res) {
        return res.json().then(function (body) {
          return { res: res, body: body };
        });
      }).then(function (result) {
        if (!result.res.ok) {
          // Never claim success on a non-2xx response; surface the error verbatim.
          msg.className = "item-msg error";
          msg.textContent = "Error " + result.res.status + ": " + (result.body.error || "request failed");
          setStatus("Request failed: " + (result.body.error || ("HTTP " + result.res.status)), "error");
          return;
        }
        msg.className = "item-msg success";
        msg.textContent = "OK";
        onOk(result.body);
      }).catch(function (err) {
        msg.className = "item-msg error";
        msg.textContent = "Network error: " + err.message;
        setStatus("Could not reach the bridge: " + err.message, "error");
      }).finally(function () {
        pending = false;
        setActionsDisabled(false);
      });
    }

    // Replace this card's item with the returned draft state, then re-render.
    function applyDraftResult(body) {
      var draftId = body.draft && body.draft.draft_id;
      var updated = items.map(function (it) {
        if (it.draft && it.draft.draft_id === draftId) {
          return Object.assign({}, it, { draft: body.draft });
        }
        return it;
      });
      items = updated;
      render();
      setStatus("Updated draft " + (draftId || "") + " → " + (body.draft ? body.draft.status : "unknown"), "success");
    }

    if (draft.status === "draft" || draft.status === "send_failed") {
      // Approve (needs operator identity + approval version).
      var approveBtn = el("button", { class: "btn-approve", type: "button", text: "Approve" });
      approveBtn.addEventListener("click", function () {
        if (!requireIdentity()) return;
        var version = versionEl.value.trim() || DEFAULT_APPROVAL_VERSION;
        run("/outreach/approve", {
          lead_email: item.lead_email,
          draft_id: draft.draft_id,
          approved_by: identity(),
          approval_version: version,
        }, function (body) {
          if (body.draft && (body.draft.status === "approved" || body.draft.status === "rejected")) {
            applyDraftResult(body);
          } else {
            refresh();
          }
        });
      });
      actions.appendChild(approveBtn);

      // Reject (needs operator identity + reject reason).
      var reasonInputId = "reject-reason-" + draft.draft_id;
      var reasonInput = el("input", {
        id: reasonInputId,
        type: "text",
        placeholder: "Rejection reason (required)",
        "aria-label": "Rejection reason for draft " + draft.draft_id,
      });
      var reasonField = el("div", { class: "field" }, [
        el("label", { for: reasonInputId, text: "Reject reason" }),
        reasonInput,
      ]);
      var rejectBtn = el("button", { class: "btn-reject", type: "button", text: "Reject" });
      rejectBtn.addEventListener("click", function () {
        if (!requireIdentity()) return;
        var reason = reasonInput.value.trim();
        if (!reason) {
          msg.className = "item-msg error";
          msg.textContent = "Enter a rejection reason before rejecting.";
          reasonInput.focus();
          return;
        }
        run("/outreach/reject", {
          lead_email: item.lead_email,
          draft_id: draft.draft_id,
          rejected_by: identity(),
          rejection_reason: reason,
        }, function (body) {
          if (body.draft && body.draft.status === "rejected") applyDraftResult(body);
          else refresh();
        });
      });
      actions.appendChild(reasonField);
      actions.appendChild(rejectBtn);
    }

    if (draft.status === "approved") {
      // Send only for approved drafts; never automatic, never hidden behind a 409.
      var sendBtn = el("button", { class: "btn-send", type: "button", text: "Send now" });
      sendBtn.addEventListener("click", function () {
        if (!requireIdentity()) return;
        run("/outreach/send", {
          lead_email: item.lead_email,
          draft_id: draft.draft_id,
        }, function (body) {
          if (body.ok) {
            msg.className = "item-msg success";
            msg.textContent = "Sent — provider id: " + (body.resend_id || "—");
            if (body.status) {
              items = items.map(function (it) {
                if (it.draft && it.draft.draft_id === draft.draft_id) {
                  return Object.assign({}, it, { draft: Object.assign({}, it.draft, { status: body.status, resend_id: body.resend_id }) });
                }
                return it;
              });
              render();
            } else {
              refresh();
            }
            setStatus("Sent draft " + draft.draft_id, "success");
          } else {
            refresh();
          }
        });
      });
      actions.appendChild(sendBtn);
      sendInfo.textContent = "Approved — send is explicit and manual.";
      card.appendChild(sendInfo);
    }

    if (draft.status === "draft" || draft.status === "send_failed" || draft.status === "approved") {
      card.appendChild(actions);
    }
    return card;
  }

  function setActionsDisabled(disabled) {
    queueEl.querySelectorAll("button, input").forEach(function (node) {
      node.disabled = disabled;
    });
    refreshBtn.disabled = disabled;
  }

  function render() {
    queueEl.textContent = "";
    if (items.length === 0) {
      queueEl.appendChild(el("p", { class: "queue-state", text: "Queue is empty — no pending or failed drafts." }));
      return;
    }
    items.forEach(function (item) {
      queueEl.appendChild(renderItem(item));
    });
  }

  function refresh() {
    if (pending) return;
    pending = true;
    setActionsDisabled(true);
    setStatus("Loading queue…");
    fetch(QUEUE_URL).then(function (res) {
      return res.json().then(function (body) {
        return { res: res, body: body };
      });
    }).then(function (result) {
      if (!result.res.ok) {
        queueEl.textContent = "";
        queueEl.appendChild(el("p", { class: "queue-state error-text", text: "Queue load failed: " + (result.body.error || ("HTTP " + result.res.status)) }));
        setStatus("Queue load failed: " + (result.body.error || ("HTTP " + result.res.status)), "error");
        return;
      }
      items = Array.isArray(result.body.items) ? result.body.items : [];
      render();
      setStatus("Loaded " + result.body.count + " item" + (result.body.count === 1 ? "" : "s") + ".",
        items.length > 0 ? "success" : "");
    }).catch(function (err) {
      queueEl.textContent = "";
      queueEl.appendChild(el("p", { class: "queue-state error-text", text: "Could not reach the bridge: " + err.message }));
      setStatus("Could not reach the bridge: " + err.message, "error");
    }).finally(function () {
      pending = false;
      setActionsDisabled(false);
    });
  }

  refreshBtn.addEventListener("click", refresh);
  refresh(); // initial load — reads only, never sends anything.
})();
</script>
</body>
</html>
